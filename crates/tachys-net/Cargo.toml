[package]
name = "tachys-net"
version = "0.0.2"
edition = "2021"
rust-version = "1.89"
publish = false
license = "CC0-1.0"

[dependencies]
# the frame's checksum (the first four bytes of Blake2b-256); the signing library brings the same crate
blake2 = "0.10"
# `rt`: the serving side starts a task for each peer (the vendored codec used to turn it on for us)
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt"] }

[dev-dependencies]
# the vendored codec, which the wallet's own (src/wire.rs) took the place of: kept for the tests, which hold the two
# to each other and use it to stand in for a node
ergo-p2p = { path = "../../vendor/arkadianet-codec/ergo-p2p" }
ergo-primitives = { path = "../../vendor/arkadianet-codec/ergo-primitives" }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
tachys-verify = { path = "../tachys-verify" }
ergo-ser = { path = "../../vendor/arkadianet-codec/ergo-ser" }
ergo-chain-types = { git = "https://github.com/ergoplatform/sigma-rust", rev = "688511dff3e3436dfdd6bd368e3eeef6f67d59e9" }
sigma-ser = { git = "https://github.com/ergoplatform/sigma-rust", rev = "688511dff3e3436dfdd6bd368e3eeef6f67d59e9" }
ergo-nipopow = { git = "https://github.com/ergoplatform/sigma-rust", rev = "688511dff3e3436dfdd6bd368e3eeef6f67d59e9" }
