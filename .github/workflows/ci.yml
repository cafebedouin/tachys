name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly: what rots is caught even when nothing is pushed

permissions:
  contents: read

# Every action is named by the commit it is, not by a tag its owner can move: what runs here on a tag is what was
# read. (The release workflow, which may write a release and sign for it, is named the same way.) To take a newer
# one: `gh api repos/OWNER/REPO/commits/TAG --jq .sha`, and read what changed.

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # a fixed toolchain: a new lint in a newer one must not turn the branch red with no change to the code
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-24
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # the whole workspace, vendored codec included, unoptimised (.cargo/config.toml gives its deep tests the stack they need)
      # the tachys crates are formatted with rustfmt (the vendored codec is not ours to format): quick, so it goes first
      - run: cargo fmt --check -p tachys -p tachys-verify -p tachys-net -p tachys-c
      # all of it is run whatever fails: the vendored codec's tests come first and four of them go by the clock
      # (docs/roadmap.md), and stopping at the first failure would leave the wallet's own tests unrun
      - run: cargo test --workspace --locked --no-fail-fast
      # the tachys crates only: the vendored codec is kept as upstream wrote it
      - run: cargo clippy --locked -p tachys -p tachys-verify -p tachys-net -p tachys-c --all-targets -- -D warnings
      # the profile the phone runs, and the library the app loads, must at least build (here for this machine, not a phone)
      - run: cargo build --locked --profile phone -p tachys -p tachys-c
      # the app ships its own copies of the seed lists
      - run: cmp seeds-mainnet.txt android/app/src/main/assets/seeds-mainnet.txt && cmp seeds-testnet.txt android/app/src/main/assets/seeds-testnet.txt
      # a build is good for sixty days from its checkpoint (docs/maintaining.md): fail the weekly run before that
      - run: |
          age=$(cargo run --locked -q -p tachys -- version --json | sed -n 's/.*"checkpoint_age_days":\([0-9]*\).*/\1/p')
          echo "checkpoint is $age days old"; test "$age" -lt 45
      - run: cargo install cargo-audit --locked --version 0.23.0 && cargo audit

  # the oldest Rust the crates say they build with (`rust-version`, and the README's "1.89 or newer")
  oldest-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-24
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked -p tachys -p tachys-verify -p tachys-net -p tachys-c --all-targets

  # the app must compile and pack, and read the core's answers as its tests say. The APK built here has no core in it
  # (android/build-core.sh needs the NDK); the tests call the core built for this machine, through the JNI entry the phone uses
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-24
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - run: cargo build --locked -p tachys-c --features jni
      # what the app makes of the core's answers, on the answers kept in vectors/app/ (which the core's tests hold it to),
      # and the core itself called in the tests' own process (NativeTest.kt, ScreensTest.kt: skipped, not passed, without TACHYS_HOST_CORE)
      - run: TACHYS_HOST_CORE="$GITHUB_WORKSPACE/target/debug" ./gradlew :shared:compileCommonMainKotlinMetadata :shared:desktopTest assembleDebug
        working-directory: android
      - run: grep -L 'skipped="0"' shared/build/test-results/desktopTest/*.xml | grep . && exit 1 || echo "no test was skipped"
        working-directory: android

  # The library a phone loads, built for a phone: android/build-core.sh, as a release's is built. The `rust` job builds
  # the phone profile for this machine only, and the `app` job packs an APK with no core in it, so until this ran a
  # link that fails for Android, or a library without the JNI entry the app calls, showed when someone next ran the
  # script by hand. The script itself refuses a library with no `Java_org_tachys_wallet_Native_call`, or with the
  # build machine's paths left in it.
  phone-core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-24
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # the runner carries an NDK under $ANDROID_HOME/ndk, which the script finds (or ANDROID_NDK_HOME, if it is set)
      - run: ./android/build-core.sh
