name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly: what rots is caught even when nothing is pushed

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # a fixed toolchain: a new lint in a newer one must not turn the branch red with no change to the code
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # the whole workspace, vendored codec included, unoptimised (.cargo/config.toml gives its deep tests the stack they need)
      - run: cargo test --workspace --locked
      # the tachys crates only: the vendored codec is kept as upstream wrote it
      - run: cargo clippy --locked -p tachys -p tachys-verify -p tachys-net -p tachys-c --all-targets -- -D warnings
      # the profile the phone runs, and the library the app loads, must at least build (here for this machine, not a phone)
      - run: cargo build --locked --profile phone -p tachys -p tachys-c
      # the app ships its own copies of the seed lists
      - run: cmp seeds-mainnet.txt android/app/src/main/assets/seeds-mainnet.txt && cmp seeds-testnet.txt android/app/src/main/assets/seeds-testnet.txt
      # a build is good for sixty days from its checkpoint (docs/maintaining.md): fail the weekly run before that
      - run: |
          age=$(cargo run --locked -q -p tachys -- version --json | sed -n 's/.*"checkpoint_age_days":\([0-9]*\).*/\1/p')
          echo "checkpoint is $age days old"; test "$age" -lt 45
      - run: cargo install cargo-audit --locked && cargo audit

  # the oldest Rust the crates say they build with (`rust-version`, and the README's "1.89 or newer")
  oldest-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p tachys -p tachys-verify -p tachys-net -p tachys-c --all-targets

  # the app must compile and pack, and read the core's answers as its tests say. The APK built here has no core in it
  # (android/build-core.sh needs the NDK); the tests call the core built for this machine, through the JNI entry the phone uses
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: cargo build --locked -p tachys-c --features jni
      # what the app makes of the core's answers, on the answers kept in vectors/app/ (which the core's tests hold it to),
      # and the core itself called in the tests' own process (NativeTest.kt, ScreensTest.kt: skipped, not passed, without TACHYS_HOST_CORE)
      - run: TACHYS_HOST_CORE="$GITHUB_WORKSPACE/target/debug" ./gradlew :shared:compileCommonMainKotlinMetadata :shared:desktopTest assembleDebug
        working-directory: android
      - run: grep -L 'skipped="0"' shared/build/test-results/desktopTest/*.xml | grep . && exit 1 || echo "no test was skipped"
        working-directory: android
